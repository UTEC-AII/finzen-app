# Reverse proxy: expone cada microservicio bajo un prefijo /api/*.
# Los servicios se resuelven por el nombre definido en docker-compose (red interna de Compose).
events {}

http {
    server {
        listen 80;

        # Rutas de usuarios y autenticación -> user-service.
        location /api/users/ {
            proxy_pass http://user-service:8001/;
        }

        # Rutas de ingresos -> income-service.
        location /api/incomes/ {
            proxy_pass http://income-service:8002/;
        }

        # Rutas de gastos -> expense-service.
        location /api/expenses/ {
            proxy_pass http://expense-service:8003/;
        }

        # Rutas de IA -> ai-service.
        location /api/ai/ {
            proxy_pass http://ai-service:8004/;
        }

        # Frontend Next.js (contenedor finzen-webui en la misma red de Docker).
        # Se usa el resolver de Docker para resolver el nombre en tiempo de petición
        # (así Nginx no falla si el frontend aún no está levantado).
        location / {
            resolver 127.0.0.11 valid=10s;
            set $frontend http://finzen-webui:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
