# Reverse proxy: sirve el frontend en / y expone cada microservicio bajo /api/*.
# Se usa el resolver de Docker (127.0.0.11) para resolver los nombres en tiempo de
# petición: así Nginx no falla al arrancar si un contenedor aún no está listo.
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Rutas de usuarios y autenticación -> user-service.
        location /api/users/ {
            set $upstream http://user-service:8001;
            rewrite ^/api/users/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # Rutas de ingresos -> income-service.
        location /api/incomes/ {
            set $upstream http://income-service:8002;
            rewrite ^/api/incomes/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # Rutas de gastos -> expense-service.
        location /api/expenses/ {
            set $upstream http://expense-service:8003;
            rewrite ^/api/expenses/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # Rutas de IA -> ai-service.
        location /api/ai/ {
            set $upstream http://ai-service:8004;
            rewrite ^/api/ai/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # Frontend Next.js (contenedor finzen-webui en la misma red de Docker).
        location / {
            set $frontend http://finzen-webui:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
