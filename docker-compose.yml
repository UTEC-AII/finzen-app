# Orquesta los 4 microservicios del backend de FinZen.
# Cada servicio tiene su propia base de datos SQLite, persistida en un volumen.
services:
  user-service:
    build: ./user-service
    container_name: finzen-user-service
    ports:
      - "8001:8001"
    environment:
      - DB_PATH=/app/data/users.db
      - SECRET_KEY=${SECRET_KEY:-finzen-dev-secret-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - users_data:/app/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  income-service:
    build: ./income-service
    container_name: finzen-income-service
    ports:
      - "8002:8002"
    environment:
      - DB_PATH=/app/data/incomes.db
      - AI_SERVICE_URL=http://ai-service:8004
      - SECRET_KEY=${SECRET_KEY:-finzen-dev-secret-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - incomes_data:/app/data
    networks:
      - backend-net
    depends_on:
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  expense-service:
    build: ./expense-service
    container_name: finzen-expense-service
    ports:
      - "8003:8003"
    environment:
      - DB_PATH=/app/data/expenses.db
      - AI_SERVICE_URL=http://ai-service:8004
      - SECRET_KEY=${SECRET_KEY:-finzen-dev-secret-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - expenses_data:/app/data
    networks:
      - backend-net
    depends_on:
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  ai-service:
    build: ./ai-service
    container_name: finzen-ai-service
    ports:
      - "8004:8004"
    environment:
      - DB_PATH=/app/data/vectors.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-finzen-dev-secret-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - vectors_data:/app/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  # Reverse proxy: publica cada microservicio bajo /api/* y los resuelve por nombre de servicio.
  nginx:
    image: nginx:alpine
    container_name: finzen-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      user-service:
        condition: service_healthy
      income-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  # Red expuesta (Nginx) y red interna (solo entre microservicios).
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  users_data:
  incomes_data:
  expenses_data:
  vectors_data:
